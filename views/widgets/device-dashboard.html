<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Dashboard</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --ddw-bg-card: #ffffff;
        --ddw-text: #1a1a1a;
        --ddw-text-secondary: rgba(0, 0, 0, 0.5);
        --ddw-text-muted: rgba(0, 0, 0, 0.4);
        --ddw-text-faint: rgba(0, 0, 0, 0.35);
        --ddw-bg-surface: #f8f9fa;
        --ddw-bg-element: #f8f9fb;
        --ddw-bg-icon: #f0f4ff;
        --ddw-border: rgba(0, 0, 0, 0.08);
        --ddw-border-light: rgba(0, 0, 0, 0.06);
        --ddw-border-subtle: rgba(0, 0, 0, 0.05);
        --ddw-border-faint: rgba(0, 0, 0, 0.04);
        --ddw-badge-bg: #e8f5e9;
        --ddw-badge-text: #2e7d32;
        --ddw-accent: #5b7cf7;
        --ddw-text-label: #4a5568;
        --ddw-text-chip: #2d3748;
        --ddw-bar-bg: #e2e8f0;
        --ddw-bar-fill: #f6ad55;
        --ddw-power-on: #48bb78;
        --ddw-power-off: #cbd5e0;
        --ddw-toggle-hover: #f0f1f3;
        --ddw-loading-text: rgba(0, 0, 0, 0.45);
        --ddw-attr-chip-bg: #ffffff;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: var(--ddw-text);
        background: transparent;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Loading state ─────────────────────────────────── */

      .ddw-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 120px;
        gap: 12px;
        color: var(--ddw-loading-text);
        font-size: 14px;
      }

      .ddw-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--ddw-border);
        border-top-color: var(--ddw-accent);
        border-radius: 50%;
        animation: ddw-spin 0.7s linear infinite;
      }

      @keyframes ddw-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Card container ────────────────────────────────── */

      .ddw-card {
        max-width: 560px;
        margin: 0 auto;
        background: var(--ddw-bg-card);
        border: 1px solid var(--ddw-border);
        border-radius: 16px;
        overflow: hidden;
      }

      /* ── Header ────────────────────────────────────────── */

      .ddw-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid var(--ddw-border-light);
      }

      .ddw-title-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .ddw-device-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--ddw-bg-icon);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        flex-shrink: 0;
      }

      .ddw-title-text {
        flex: 1;
        min-width: 0;
      }

      .ddw-label {
        font-size: 18px;
        font-weight: 700;
        color: var(--ddw-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ddw-desc {
        font-size: 13px;
        color: var(--ddw-text-secondary);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ddw-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        background: var(--ddw-badge-bg);
        color: var(--ddw-badge-text);
        flex-shrink: 0;
        white-space: nowrap;
      }

      /* ── Body ──────────────────────────────────────────── */

      .ddw-body {
        padding: 16px 24px 20px;
      }

      .ddw-section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--ddw-text-muted);
        margin: 0 0 8px;
      }

      /* Info grid (location, group, brand, ownership) */

      .ddw-info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 16px;
      }

      .ddw-info-item {
        padding: 10px 12px;
        background: var(--ddw-bg-surface);
        border-radius: 10px;
      }

      .ddw-info-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--ddw-text-muted);
        margin-bottom: 3px;
      }

      .ddw-info-value {
        font-size: 13px;
        font-weight: 500;
        color: var(--ddw-text);
        word-break: break-word;
      }

      /* ── State section ─────────────────────────────────── */

      .ddw-state-section {
        margin-bottom: 16px;
      }

      .ddw-state-empty {
        padding: 12px;
        background: var(--ddw-bg-surface);
        border-radius: 10px;
        color: var(--ddw-text-faint);
        font-size: 13px;
        text-align: center;
        font-style: italic;
      }

      /* Per-element state block */
      .ddw-element-block {
        background: var(--ddw-bg-element);
        border: 1px solid var(--ddw-border-subtle);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }

      .ddw-element-block:last-child {
        margin-bottom: 0;
      }

      .ddw-element-header {
        margin-bottom: 8px;
      }

      .ddw-element-id {
        font-size: 12px;
        font-weight: 700;
        color: var(--ddw-text-label);
      }

      .ddw-power-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
      }

      .ddw-power-on {
        background: var(--ddw-power-on);
      }
      .ddw-power-off {
        background: var(--ddw-power-off);
      }
      .ddw-power-label {
        font-size: 12px;
        font-weight: 600;
        vertical-align: middle;
      }

      .ddw-attr-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .ddw-attr-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        background: var(--ddw-attr-chip-bg);
        border: 1px solid var(--ddw-border);
        border-radius: 8px;
        font-size: 12px;
        color: var(--ddw-text-chip);
      }

      .ddw-attr-name {
        color: var(--ddw-text-secondary);
        font-weight: 500;
      }

      .ddw-attr-val {
        font-weight: 600;
      }

      /* Brightness bar */
      .ddw-brightness-bar {
        display: inline-block;
        width: 40px;
        height: 6px;
        background: var(--ddw-bar-bg);
        border-radius: 3px;
        vertical-align: middle;
        overflow: hidden;
      }

      .ddw-brightness-fill {
        display: block;
        height: 100%;
        background: var(--ddw-bar-fill);
        border-radius: 3px;
      }

      /* ── Technical details (collapsible) ───────────────── */

      .ddw-details-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 10px 12px;
        background: var(--ddw-bg-surface);
        border: 1px solid var(--ddw-border-light);
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--ddw-text-label);
        transition: background-color 0.15s;
      }

      .ddw-details-toggle:hover {
        background: var(--ddw-toggle-hover);
      }

      .ddw-details-arrow {
        font-size: 10px;
        transition: transform 0.2s;
      }

      .ddw-details-toggle[aria-expanded='true'] .ddw-details-arrow {
        transform: rotate(90deg);
      }

      .ddw-details-content {
        display: none;
        margin-top: 8px;
      }

      .ddw-details-content.ddw-open {
        display: block;
      }

      .ddw-detail-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 6px 12px;
        font-size: 12px;
        border-bottom: 1px solid var(--ddw-border-faint);
      }

      .ddw-detail-row:last-child {
        border-bottom: none;
      }

      .ddw-detail-key {
        color: var(--ddw-loading-text);
        font-weight: 600;
        white-space: nowrap;
        min-width: 80px;
      }

      .ddw-detail-val {
        color: var(--ddw-text);
        font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        font-size: 11px;
        word-break: break-all;
      }

      /* ── Footer ────────────────────────────────────────── */

      .ddw-footer {
        padding: 12px 24px;
        background: var(--ddw-bg-surface);
        border-top: 1px solid var(--ddw-border-light);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ddw-footer-text {
        font-size: 11px;
        color: var(--ddw-text-faint);
      }

      /* ── Responsive ────────────────────────────────────── */

      @media (max-width: 480px) {
        .ddw-info-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── Dark theme ─────────────────────────────────── */

      .ddw-dark {
        --ddw-bg-card: #2d2d2d;
        --ddw-text: #e0e0e0;
        --ddw-text-secondary: rgba(255, 255, 255, 0.6);
        --ddw-text-muted: rgba(255, 255, 255, 0.45);
        --ddw-text-faint: rgba(255, 255, 255, 0.35);
        --ddw-bg-surface: #383838;
        --ddw-bg-element: #353535;
        --ddw-bg-icon: #2a3040;
        --ddw-border: rgba(255, 255, 255, 0.1);
        --ddw-border-light: rgba(255, 255, 255, 0.08);
        --ddw-border-subtle: rgba(255, 255, 255, 0.06);
        --ddw-border-faint: rgba(255, 255, 255, 0.05);
        --ddw-badge-bg: #1b3a2a;
        --ddw-badge-text: #66bb6a;
        --ddw-accent: #7b9cf7;
        --ddw-text-label: #a0aec0;
        --ddw-text-chip: #cbd5e0;
        --ddw-bar-bg: #4a5568;
        --ddw-bar-fill: #f6ad55;
        --ddw-power-on: #48bb78;
        --ddw-power-off: #4a5568;
        --ddw-toggle-hover: #444444;
        --ddw-loading-text: rgba(255, 255, 255, 0.45);
        --ddw-attr-chip-bg: #3a3a3a;
      }

      @media (prefers-color-scheme: dark) {
        :root:not(.ddw-light) {
          --ddw-bg-card: #2d2d2d;
          --ddw-text: #e0e0e0;
          --ddw-text-secondary: rgba(255, 255, 255, 0.6);
          --ddw-text-muted: rgba(255, 255, 255, 0.45);
          --ddw-text-faint: rgba(255, 255, 255, 0.35);
          --ddw-bg-surface: #383838;
          --ddw-bg-element: #353535;
          --ddw-bg-icon: #2a3040;
          --ddw-border: rgba(255, 255, 255, 0.1);
          --ddw-border-light: rgba(255, 255, 255, 0.08);
          --ddw-border-subtle: rgba(255, 255, 255, 0.06);
          --ddw-border-faint: rgba(255, 255, 255, 0.05);
          --ddw-badge-bg: #1b3a2a;
          --ddw-badge-text: #66bb6a;
          --ddw-accent: #7b9cf7;
          --ddw-text-label: #a0aec0;
          --ddw-text-chip: #cbd5e0;
          --ddw-bar-bg: #4a5568;
          --ddw-bar-fill: #f6ad55;
          --ddw-power-on: #48bb78;
          --ddw-power-off: #4a5568;
          --ddw-toggle-hover: #444444;
          --ddw-loading-text: rgba(255, 255, 255, 0.45);
          --ddw-attr-chip-bg: #3a3a3a;
        }
      }
    </style>
  </head>
  <body>
    <div id="ddw-root">
      <div class="ddw-loading">
        <div class="ddw-spinner"></div>
        <span id="ddw-loading-text">Loading device data…</span>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        var root = document.getElementById('ddw-root');

        /* ── i18n ──────────────────────────────────────────── */

        // Locale data injected server-side as window.__I18N__
        // from views/widgets/locales/*.json — add a new language
        // by dropping a .json file there, zero code changes needed.
        var STRINGS = window.__I18N__ || {};

        /**
         * Translate helper. Reads ChatGPT's locale from
         * document.documentElement.lang (set by OpenAI Apps SDK),
         * normalizes to base language code, falls back to English.
         */
        var _lang = null;
        function t(key) {
          if (!_lang) {
            console.log('[DDW] Setting language, document.documentElement.lang:', document.documentElement.lang);
            _lang = (document.documentElement.lang || 'en').split('-')[0].toLowerCase();
            if (!STRINGS[_lang]) _lang = 'en';
            // Update loading text on first call
            var loadEl = document.getElementById('ddw-loading-text');
            if (loadEl && STRINGS[_lang]) loadEl.textContent = STRINGS[_lang].loading || '';
          }
          return (STRINGS[_lang] && STRINGS[_lang][key]) || (STRINGS.en && STRINGS.en[key]) || key;
        }


        /* ── Theme detection (with logging) ──────────────── */

        console.log('[DDW] Initializing widget...');
        console.log('[DDW] document.documentElement.lang:', document.documentElement.lang);
        console.log('[DDW] window.openai:', window.openai);

        function applyTheme(theme) {
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('ddw-dark');
            root.classList.remove('ddw-light');
          } else if (theme === 'light') {
            root.classList.add('ddw-light');
            root.classList.remove('ddw-dark');
          }
          // If no explicit theme, CSS @media (prefers-color-scheme) handles it
        }

        // Read initial theme from OpenAI Apps SDK
        if (window.openai && window.openai.theme) {
          console.log('[DDW] Initial theme from window.openai.theme:', window.openai.theme);
          applyTheme(window.openai.theme);
        }

        // Listen for theme changes from host
        window.addEventListener('openai:set_globals', function (event) {
          console.log('[DDW] openai:set_globals received, event.detail:', event.detail);
          var globals = event.detail && event.detail.globals;
          if (globals && globals.theme) {
            applyTheme(globals.theme);
          }
        }, { passive: true });

        /* ── Device icon map (keyed by raw DEVICE_TYPE enum) ── */

        var DEVICE_ICONS = {
          LIGHT: '\uD83D\uDCA1',
          SWITCH: '\uD83D\uDD18',
          PLUG: '\uD83D\uDD0C',
          CURTAINS: '\uD83E\uDE9F',
          DOORLOCK: '\uD83D\uDD12',
          DOORBELL: '\uD83D\uDD14',
          CAMERA: '\uD83D\uDCF7',
          SPEAKER: '\uD83D\uDD0A',
          AC: '\u2744\uFE0F',
          AC_CONTROLLER: '\u2744\uFE0F',
          TV: '\uD83D\uDCFA',
          FAN: '\uD83C\uDF00',
          GATE: '\uD83D\uDEAA',
          IR_DEVICE_CONTROLLER: '\uD83D\uDCF1',
          SIREN: '\uD83D\uDEA8',
          GATEWAY: '\uD83C\uDF10',
          SENSOR_DEVICE: '\uD83D\uDCE1',
          MOTION_SENSOR: '\uD83D\uDCE1',
          MOTION_LUX_SENSOR: '\uD83D\uDCE1',
          PRESENCE_SENSOR: '\uD83D\uDCE1',
          TEMP_SENSOR: '\uD83C\uDF21',
          HEAT_SENSOR: '\uD83C\uDF21',
          SMOKE_SENSOR: '\uD83D\uDCA8',
          DOOR_SENSOR: '\uD83D\uDEAA',
          DUST_SENSOR: '\uD83C\uDF2B',
          LUX_SENSOR: '\u2600\uFE0F',
          DIMMER: '\uD83D\uDCA1',
          DIMMER_SCENE: '\uD83D\uDCA1',
          SWITCH_LIGHT_DIMMER: '\uD83D\uDCA1',
          SWITCH_SCENE: '\uD83D\uDD18',
          MACHINE_COFFEE: '\u2615',
        };

        function getIcon(deviceType) {
          return (deviceType && DEVICE_ICONS[deviceType]) || '\uD83D\uDCDF';
        }

        /* ── Attribute ID → translated name ───────────────── */

        var ATTR_NAME_KEYS = {
          1: 'attr_power',
          2: 'attr_open_close',
          3: 'attr_lock',
          17: 'attr_mode',
          18: 'attr_swing',
          19: 'attr_fan_speed',
          20: 'attr_temperature',
          28: 'attr_brightness',
          29: 'attr_color_temp',
          30: 'attr_brightness_kelvin',
          31: 'attr_color_hsv',
          82: 'attr_ir_button',
          257: 'attr_ac_control',
        };

        var AC_MODE_KEYS = { 0: 'auto', 1: 'cool', 2: 'dry', 3: 'heat', 4: 'fan' };
        var FAN_SPEED_KEYS = {
          0: 'auto',
          1: 'low',
          2: 'normal',
          3: 'high',
          4: 'max',
          255: 'custom',
        };

        /* ── Formatting helpers ──────────────────────────── */

        function esc(str) {
          if (str == null) return '';
          var d = document.createElement('div');
          d.appendChild(document.createTextNode(String(str)));
          return d.innerHTML;
        }

        /** Format a single attribute's value array into readable HTML */
        function formatAttrValue(attrId, arr) {
          // arr = [ATTR_ID, VALUE1, VALUE2, ...] — skip index 0
          if (!Array.isArray(arr) || arr.length < 2) return esc(JSON.stringify(arr));
          var vals = arr.slice(1);

          switch (String(attrId)) {
            case '1': // ON_OFF
              return vals[0] === 1
                ? '<span class="ddw-power-dot ddw-power-on"></span><span class="ddw-power-label">' + esc(t('on')) + '</span>'
                : '<span class="ddw-power-dot ddw-power-off"></span><span class="ddw-power-label">' + esc(t('off')) + '</span>';

            case '2': // OPEN_CLOSE
              return (
                '<span class="ddw-attr-val">' + esc(vals[0] === 1 ? t('open') : t('closed')) + '</span>'
              );

            case '3': // LOCK_UNLOCK
              return (
                '<span class="ddw-attr-val">' + esc(vals[0] === 1 ? t('unlocked') : t('locked')) + '</span>'
              );

            case '17': // MODE (AC)
              var modeKey = AC_MODE_KEYS[vals[0]];
              return '<span class="ddw-attr-val">' + esc(modeKey ? t(modeKey) : vals[0]) + '</span>';

            case '18': // FAN_SWING
              return (
                '<span class="ddw-attr-val">' +
                esc(vals[0] === 0 ? t('auto') : vals[0] === 255 ? t('off') : vals[0]) +
                '</span>'
              );

            case '19': // FAN_SPEED
              var fsKey = FAN_SPEED_KEYS[vals[0]];
              return (
                '<span class="ddw-attr-val">' + esc(fsKey ? t(fsKey) : vals[0]) + '</span>'
              );

            case '20': // TEMP_SET
              return '<span class="ddw-attr-val">' + esc(vals[0]) + '\u00B0C</span>';

            case '28': // BRIGHTNESS (0-1000)
              var pct = Math.round(vals[0] / 10);
              return (
                '<span class="ddw-brightness-bar"><span class="ddw-brightness-fill" style="width:' +
                pct +
                '%"></span></span> ' +
                '<span class="ddw-attr-val">' +
                pct +
                '%</span>'
              );

            case '29': // KELVIN
              return '<span class="ddw-attr-val">' + esc(vals[0]) + 'K</span>';

            case '30': // BRIGHTNESS_KELVIN
              var bPct = Math.round(vals[0] / 10);
              return (
                '<span class="ddw-brightness-bar"><span class="ddw-brightness-fill" style="width:' +
                bPct +
                '%"></span></span> ' +
                '<span class="ddw-attr-val">' +
                bPct +
                '% \u00B7 ' +
                esc(vals[1]) +
                'K</span>'
              );

            case '31': // COLOR_HSV
              var h = Math.round(vals[0] / 10);
              var s = Math.round(vals[1] / 10);
              var v = Math.round(vals[2] / 10);
              var preview = 'hsl(' + h + ', ' + s + '%, ' + Math.max(v, 30) + '%)';
              return (
                '<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:' +
                preview +
                ';vertical-align:middle;margin-right:4px;border:1px solid rgba(0,0,0,0.1)"></span>' +
                '<span class="ddw-attr-val">H' +
                h +
                '\u00B0 S' +
                s +
                '% V' +
                v +
                '%</span>'
              );

            case '257': // AC combined [on/off, mode, temp, fan, swing]
              var parts = [];
              parts.push(vals[0] === 1 ? t('on') : t('off'));
              if (vals[1] != null) {
                var acMKey = AC_MODE_KEYS[vals[1]];
                parts.push(acMKey ? t(acMKey) : t('mode_prefix') + ' ' + vals[1]);
              }
              if (vals[2] != null) parts.push(vals[2] + '\u00B0C');
              if (vals[3] != null) {
                var acFKey = FAN_SPEED_KEYS[vals[3]];
                parts.push(t('fan_prefix') + ': ' + (acFKey ? t(acFKey) : vals[3]));
              }
              if (vals[4] != null)
                parts.push(
                  t('swing_prefix') + ': ' + (vals[4] === 0 ? t('auto') : vals[4] === 255 ? t('off') : vals[4]),
                );
              return '<span class="ddw-attr-val">' + esc(parts.join(' \u00B7 ')) + '</span>';

            default:
              return '<span class="ddw-attr-val">' + esc(vals.join(', ')) + '</span>';
          }
        }

        /* ── Parse state into per-element structure ──────── */

        /**
         * Validates whether an object is an element→attribute map:
         *   { "elemId": { "attrId": [attrId, value, ...] } }
         * Attribute values MUST be arrays. If they're objects, we're
         * one nesting level too high (e.g. seeing the wrapper, not the map).
         */
        function isElementAttrMap(obj) {
          if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
          var keys = Object.keys(obj);
          if (keys.length === 0) return false;

          var first = obj[keys[0]];
          if (!first || typeof first !== 'object' || Array.isArray(first)) return false;

          // Critical check: the inner values (attribute values) should be ARRAYS
          // e.g. { "1": [1, 1], "28": [28, 800] } — values are arrays ✓
          // vs   { "1": { "1": [1,1] }, "2": { "1": [1,0] } } — values are objects ✗
          var innerKeys = Object.keys(first);
          if (innerKeys.length === 0) return false;
          return Array.isArray(first[innerKeys[0]]);
        }

        /**
         * State from API arrives nested under device ID:
         *   { DEVICE_ID: { ELEMENT_ID: { ATTR_ID: [attrId, value, ...] } } }
         * May also be further wrapped:
         *   { state: { DEVICE_ID: { ... } }, mac, devId, ... }
         *   [{ state: { ... } }]
         * Returns array of { elementId, attrs: [{ attrId, values }] } or null.
         */
        function parseState(raw) {
          if (!raw || typeof raw !== 'object') return null;

          var stateObj = raw;

          // Iteratively unwrap until we find the element→attribute map.
          // Each iteration peels one wrapper: .state key, array[0], or device-ID key.
          // Max 5 iterations guards against infinite loops on bad data.
          for (var depth = 0; depth < 5; depth++) {
            // Handle array wrapper: [{ state: {...} }]
            if (Array.isArray(stateObj)) {
              if (stateObj.length > 0 && stateObj[0] && stateObj[0].state) {
                stateObj = stateObj[0].state;
                continue;
              }
              return null;
            }

            // Found it!
            if (isElementAttrMap(stateObj)) break;

            // Try unwrapping .state key
            if (stateObj.state && typeof stateObj.state === 'object') {
              stateObj = stateObj.state;
              continue;
            }

            // Try unwrapping device-ID wrapper: single (or few) key(s) whose values
            // are objects-of-objects (the element map). Pick the first one.
            var topKeys = Object.keys(stateObj);
            if (topKeys.length > 0) {
              var candidate = stateObj[topKeys[0]];
              if (candidate && typeof candidate === 'object' && !Array.isArray(candidate)) {
                if (isElementAttrMap(candidate)) {
                  stateObj = candidate;
                  break;
                }
                // Still deeper nesting — keep unwrapping
                stateObj = candidate;
                continue;
              }
            }

            break; // Nothing more to unwrap
          }

          // Final validation
          if (!isElementAttrMap(stateObj)) return null;

          var elementIds = Object.keys(stateObj).sort(function (a, b) {
            return Number(a) - Number(b);
          });

          var elements = [];
          for (var i = 0; i < elementIds.length; i++) {
            var eid = elementIds[i];
            var attrObj = stateObj[eid];
            if (!attrObj || typeof attrObj !== 'object') continue;

            var attrIds = Object.keys(attrObj).sort(function (a, b) {
              return Number(a) - Number(b);
            });
            var attrs = [];
            for (var j = 0; j < attrIds.length; j++) {
              attrs.push({ attrId: attrIds[j], values: attrObj[attrIds[j]] });
            }
            elements.push({ elementId: eid, attrs: attrs });
          }

          return elements.length > 0 ? elements : null;
        }

        /* ── Build the card HTML ──────────────────────────── */

        function render(data) {
          if (!data) return;

          var icon = data.deviceIcon || getIcon(data.deviceType);
          var label = data.label || t('unnamed_device');
          var desc = data.desc || '';
          var deviceType = data.deviceType || null;
          var locationLabel = data.locationLabel || null;
          var groupLabel = data.groupLabel || null;
          var brand = data.brand || null;
          var ownership = data.ownership || null;
          var stateElements = parseState(data.state);

          // Technical details (hidden by default)
          var uuid = data.uuid || null;
          var mac = data.mac || null;
          var productId = data.productId || null;
          var locationId = data.locationId || null;
          var groupId = data.groupId || null;
          var eid = data.eid != null ? data.eid : null;
          var endpoint = data.endpoint || null;
          var elementIds = data.elementIds || [];

          var html = '<div class="ddw-card">';

          /* Header */
          html += '<div class="ddw-header"><div class="ddw-title-row">';
          html += '<div class="ddw-device-icon">' + esc(icon) + '</div>';
          html += '<div class="ddw-title-text">';
          html += '<div class="ddw-label">' + esc(label) + '</div>';
          if (desc) html += '<div class="ddw-desc">' + esc(desc) + '</div>';
          html += '</div>';
          if (deviceType) html += '<span class="ddw-badge">' + esc(t('dt_' + deviceType)) + '</span>';
          html += '</div></div>';

          /* Body */
          html += '<div class="ddw-body">';

          /* Info grid */
          var hasInfo = locationLabel || groupLabel;
          if (hasInfo) {
            html += '<div class="ddw-info-grid">';
            if (locationLabel) {
              html += '<div class="ddw-info-item">';
              html += '<div class="ddw-info-label">' + esc(t('location')) + '</div>';
              html += '<div class="ddw-info-value">' + esc(locationLabel) + '</div>';
              html += '</div>';
            }
            if (groupLabel) {
              html += '<div class="ddw-info-item">';
              html += '<div class="ddw-info-label">' + esc(t('group')) + '</div>';
              html += '<div class="ddw-info-value">' + esc(groupLabel) + '</div>';
              html += '</div>';
            }
            html += '</div>';
          }

          /* State section — per-element blocks */
          html += '<div class="ddw-state-section">';
          html += '<div class="ddw-section-label">' + esc(t('device_state')) + '</div>';

          if (stateElements) {
            var multiElement = stateElements.length > 1;

            for (var ei = 0; ei < stateElements.length; ei++) {
              var el = stateElements[ei];
              html += '<div class="ddw-element-block">';

              /* Element header — only show label for multi-element devices */
              if (multiElement) {
                html += '<div class="ddw-element-header">';
                html += '<span class="ddw-element-id">' + esc(t('element')) + ' ' + esc(el.elementId) + '</span>';
                html += '</div>';
              }

              /* Render ALL attributes as chips — each type has its own visual */
              html += '<div class="ddw-attr-list">';
              for (var ai = 0; ai < el.attrs.length; ai++) {
                var attr = el.attrs[ai];
                var nameKey = ATTR_NAME_KEYS[attr.attrId];
                var attrName = nameKey ? t(nameKey) : t('attr_prefix') + ' ' + attr.attrId;
                html += '<div class="ddw-attr-chip">';
                html += '<span class="ddw-attr-name">' + esc(attrName) + '</span> ';
                html += formatAttrValue(attr.attrId, attr.values);
                html += '</div>';
              }
              html += '</div>';

              html += '</div>'; // element-block
            }
          } else {
            html += '<div class="ddw-state-empty">' + esc(t('no_state')) + '</div>';
          }
          html += '</div>';

          /* Technical details (collapsible) */
          var technicalRows = [];
          if (brand) technicalRows.push([t('td_brand'), brand]);
          if (ownership) technicalRows.push([t('td_ownership'), ownership]);
          if (uuid) technicalRows.push([t('td_uuid'), uuid]);
          if (mac) technicalRows.push([t('td_mac'), mac]);
          if (productId) technicalRows.push([t('td_product_id'), productId]);
          if (locationId) technicalRows.push([t('td_location_id'), locationId]);
          if (groupId) technicalRows.push([t('td_group_id'), groupId]);
          if (eid != null) technicalRows.push([t('td_eid'), eid]);
          if (endpoint) technicalRows.push([t('td_endpoint'), endpoint]);
          if (elementIds.length > 0) technicalRows.push([t('td_element_ids'), elementIds.join(', ')]);

          if (technicalRows.length > 0) {
            html +=
              "<button class=\"ddw-details-toggle\" aria-expanded=\"false\" onclick=\"this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); this.nextElementSibling.classList.toggle('ddw-open')\">";
            html += '<span class="ddw-details-arrow">\u25B6</span> ' + esc(t('technical_details'));
            html += '</button>';
            html += '<div class="ddw-details-content">';
            for (var ti = 0; ti < technicalRows.length; ti++) {
              html += detailRow(technicalRows[ti][0], technicalRows[ti][1]);
            }
            html += '</div>';
          }

          html += '</div>'; // body

          /* Footer */
          html += '<div class="ddw-footer">';
          html += '<span class="ddw-footer-text">' + esc(t('footer')) + '</span>';
          html += '</div>';

          html += '</div>'; // card

          root.innerHTML = html;
        }

        function detailRow(key, value) {
          return (
            '<div class="ddw-detail-row">' +
            '<span class="ddw-detail-key">' +
            esc(key) +
            '</span>' +
            '<span class="ddw-detail-val">' +
            esc(value) +
            '</span>' +
            '</div>'
          );
        }

        /* ── Data bridge: OpenAI Apps SDK ───────────────── */

        // 1. Try reading initial data from window.openai globals
        if (window.openai && window.openai.toolOutput) {
          render(window.openai.toolOutput);
        }

        // 2. Listen for tool-result via postMessage (MCP Apps bridge)
        window.addEventListener(
          'message',
          function (event) {
            if (event.source !== window.parent) return;
            var msg = event.data;
            if (!msg || typeof msg !== 'object') return;

            // Standard MCP Apps bridge message
            if (msg.jsonrpc === '2.0' && msg.method === 'ui/notifications/tool-result') {
              var sc = msg.params && msg.params.structuredContent;
              if (sc) render(sc);
            }

            // Direct structuredContent pass-through (some hosts)
            if (msg.type === 'tool-result' && msg.structuredContent) {
              render(msg.structuredContent);
            }
          },
          { passive: true },
        );

        // 3. Listen for set_globals event (OpenAI Apps SDK)
        window.addEventListener(
          'openai:set_globals',
          function (event) {
            var globals = event.detail && event.detail.globals;
            if (globals && globals.toolOutput) {
              render(globals.toolOutput);
            }
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>
