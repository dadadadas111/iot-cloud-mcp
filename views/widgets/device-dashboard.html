<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Dashboard</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #1a1a1a;
        background: transparent;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* ── Loading state ─────────────────────────────────── */

      .ddw-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 120px;
        gap: 12px;
        color: rgba(0, 0, 0, 0.45);
        font-size: 14px;
      }

      .ddw-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(0, 0, 0, 0.08);
        border-top-color: #5b7cf7;
        border-radius: 50%;
        animation: ddw-spin 0.7s linear infinite;
      }

      @keyframes ddw-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Card container ────────────────────────────────── */

      .ddw-card {
        max-width: 560px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 16px;
        overflow: hidden;
      }

      /* ── Header ────────────────────────────────────────── */

      .ddw-header {
        padding: 20px 24px 16px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }

      .ddw-title-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .ddw-device-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #f0f4ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        flex-shrink: 0;
      }

      .ddw-title-text {
        flex: 1;
        min-width: 0;
      }

      .ddw-label {
        font-size: 18px;
        font-weight: 700;
        color: #1a1a1a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ddw-desc {
        font-size: 13px;
        color: rgba(0, 0, 0, 0.5);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .ddw-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        background: #e8f5e9;
        color: #2e7d32;
        flex-shrink: 0;
        white-space: nowrap;
      }

      /* ── Body ──────────────────────────────────────────── */

      .ddw-body {
        padding: 16px 24px 20px;
      }

      .ddw-section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: rgba(0, 0, 0, 0.4);
        margin: 0 0 8px;
      }

      /* Info grid (location, group, brand, ownership) */

      .ddw-info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 16px;
      }

      .ddw-info-item {
        padding: 10px 12px;
        background: #f8f9fa;
        border-radius: 10px;
      }

      .ddw-info-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: rgba(0, 0, 0, 0.4);
        margin-bottom: 3px;
      }

      .ddw-info-value {
        font-size: 13px;
        font-weight: 500;
        color: #1a1a1a;
        word-break: break-word;
      }

      /* ── State section ─────────────────────────────────── */

      .ddw-state-section {
        margin-bottom: 16px;
      }

      .ddw-state-empty {
        padding: 12px;
        background: #f8f9fa;
        border-radius: 10px;
        color: rgba(0, 0, 0, 0.35);
        font-size: 13px;
        text-align: center;
        font-style: italic;
      }

      /* Per-element state block */
      .ddw-element-block {
        background: #f8f9fb;
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }

      .ddw-element-block:last-child {
        margin-bottom: 0;
      }

      .ddw-element-header {
        margin-bottom: 8px;
      }

      .ddw-element-id {
        font-size: 12px;
        font-weight: 700;
        color: #4a5568;
      }

      .ddw-power-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
      }

      .ddw-power-on {
        background: #48bb78;
      }
      .ddw-power-off {
        background: #cbd5e0;
      }
      .ddw-power-label {
        font-size: 12px;
        font-weight: 600;
        vertical-align: middle;
      }

      .ddw-attr-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .ddw-attr-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        background: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 8px;
        font-size: 12px;
        color: #2d3748;
      }

      .ddw-attr-name {
        color: rgba(0, 0, 0, 0.5);
        font-weight: 500;
      }

      .ddw-attr-val {
        font-weight: 600;
      }

      /* Brightness bar */
      .ddw-brightness-bar {
        display: inline-block;
        width: 40px;
        height: 6px;
        background: #e2e8f0;
        border-radius: 3px;
        vertical-align: middle;
        overflow: hidden;
      }

      .ddw-brightness-fill {
        display: block;
        height: 100%;
        background: #f6ad55;
        border-radius: 3px;
      }

      /* ── Technical details (collapsible) ───────────────── */

      .ddw-details-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 10px 12px;
        background: #f8f9fa;
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 10px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #4a5568;
        transition: background-color 0.15s;
      }

      .ddw-details-toggle:hover {
        background: #f0f1f3;
      }

      .ddw-details-arrow {
        font-size: 10px;
        transition: transform 0.2s;
      }

      .ddw-details-toggle[aria-expanded='true'] .ddw-details-arrow {
        transform: rotate(90deg);
      }

      .ddw-details-content {
        display: none;
        margin-top: 8px;
      }

      .ddw-details-content.ddw-open {
        display: block;
      }

      .ddw-detail-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 6px 12px;
        font-size: 12px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      }

      .ddw-detail-row:last-child {
        border-bottom: none;
      }

      .ddw-detail-key {
        color: rgba(0, 0, 0, 0.45);
        font-weight: 600;
        white-space: nowrap;
        min-width: 80px;
      }

      .ddw-detail-val {
        color: #1a1a1a;
        font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        font-size: 11px;
        word-break: break-all;
      }

      /* ── Footer ────────────────────────────────────────── */

      .ddw-footer {
        padding: 12px 24px;
        background: #f8f9fa;
        border-top: 1px solid rgba(0, 0, 0, 0.06);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ddw-footer-text {
        font-size: 11px;
        color: rgba(0, 0, 0, 0.35);
      }

      /* ── Responsive ────────────────────────────────────── */

      @media (max-width: 480px) {
        .ddw-info-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="ddw-root">
      <div class="ddw-loading">
        <div class="ddw-spinner"></div>
        <span>Loading device data…</span>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        var root = document.getElementById('ddw-root');

        /* ── Device icon map ──────────────────────────────── */

        var DEVICE_ICONS = {
          'LED Light': '\uD83D\uDCA1',
          Switch: '\uD83D\uDD18',
          AC: '\u2744\uFE0F',
          Lock: '\uD83D\uDD12',
          Gate: '\uD83D\uDEAA',
          Fan: '\uD83C\uDF00',
          Sensor: '\uD83D\uDCE1',
          Curtain: '\uD83E\uDE9F',
          'IR Remote': '\uD83D\uDCF1',
          Camera: '\uD83D\uDCF7',
        };

        function getIcon(deviceType) {
          return (deviceType && DEVICE_ICONS[deviceType]) || '\uD83D\uDCDF';
        }

        /* ── Attribute ID → human-readable name ───────────── */

        var ATTR_NAMES = {
          1: 'Power',
          2: 'Open/Close',
          3: 'Lock',
          17: 'Mode',
          18: 'Swing',
          19: 'Fan Speed',
          20: 'Temperature',
          28: 'Brightness',
          29: 'Color Temp',
          30: 'Brightness & Kelvin',
          31: 'Color HSV',
          82: 'IR Button',
          257: 'AC Control',
        };

        var AC_MODES = { 0: 'Auto', 1: 'Cool', 2: 'Dry', 3: 'Heat', 4: 'Fan' };
        var FAN_SPEEDS = { 0: 'Auto', 1: 'Low', 2: 'Normal', 3: 'High', 4: 'Max', 255: 'Custom' };

        /* ── Formatting helpers ───────────────────────────── */

        function esc(str) {
          if (str == null) return '';
          var d = document.createElement('div');
          d.appendChild(document.createTextNode(String(str)));
          return d.innerHTML;
        }

        /** Format a single attribute's value array into readable HTML */
        function formatAttrValue(attrId, arr) {
          // arr = [ATTR_ID, VALUE1, VALUE2, ...] — skip index 0
          if (!Array.isArray(arr) || arr.length < 2) return esc(JSON.stringify(arr));
          var vals = arr.slice(1);

          switch (String(attrId)) {
            case '1': // ON_OFF
              return vals[0] === 1
                ? '<span class="ddw-power-dot ddw-power-on"></span><span class="ddw-power-label">On</span>'
                : '<span class="ddw-power-dot ddw-power-off"></span><span class="ddw-power-label">Off</span>';

            case '2': // OPEN_CLOSE
              return (
                '<span class="ddw-attr-val">' + (vals[0] === 1 ? 'Open' : 'Closed') + '</span>'
              );

            case '3': // LOCK_UNLOCK
              return (
                '<span class="ddw-attr-val">' + (vals[0] === 1 ? 'Unlocked' : 'Locked') + '</span>'
              );

            case '17': // MODE (AC)
              return '<span class="ddw-attr-val">' + esc(AC_MODES[vals[0]] || vals[0]) + '</span>';

            case '18': // FAN_SWING
              return (
                '<span class="ddw-attr-val">' +
                (vals[0] === 0 ? 'Auto' : vals[0] === 255 ? 'Off' : esc(vals[0])) +
                '</span>'
              );

            case '19': // FAN_SPEED
              return (
                '<span class="ddw-attr-val">' + esc(FAN_SPEEDS[vals[0]] || vals[0]) + '</span>'
              );

            case '20': // TEMP_SET
              return '<span class="ddw-attr-val">' + esc(vals[0]) + '°C</span>';

            case '28': // BRIGHTNESS (0-1000)
              var pct = Math.round(vals[0] / 10);
              return (
                '<span class="ddw-brightness-bar"><span class="ddw-brightness-fill" style="width:' +
                pct +
                '%"></span></span> ' +
                '<span class="ddw-attr-val">' +
                pct +
                '%</span>'
              );

            case '29': // KELVIN
              return '<span class="ddw-attr-val">' + esc(vals[0]) + 'K</span>';

            case '30': // BRIGHTNESS_KELVIN
              var bPct = Math.round(vals[0] / 10);
              return (
                '<span class="ddw-brightness-bar"><span class="ddw-brightness-fill" style="width:' +
                bPct +
                '%"></span></span> ' +
                '<span class="ddw-attr-val">' +
                bPct +
                '% · ' +
                esc(vals[1]) +
                'K</span>'
              );

            case '31': // COLOR_HSV
              var h = Math.round(vals[0] / 10);
              var s = Math.round(vals[1] / 10);
              var v = Math.round(vals[2] / 10);
              var preview = 'hsl(' + h + ', ' + s + '%, ' + Math.max(v, 30) + '%)';
              return (
                '<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:' +
                preview +
                ';vertical-align:middle;margin-right:4px;border:1px solid rgba(0,0,0,0.1)"></span>' +
                '<span class="ddw-attr-val">H' +
                h +
                '° S' +
                s +
                '% V' +
                v +
                '%</span>'
              );

            case '257': // AC combined [on/off, mode, temp, fan, swing]
              var parts = [];
              parts.push(vals[0] === 1 ? 'On' : 'Off');
              if (vals[1] != null) parts.push(AC_MODES[vals[1]] || 'Mode ' + vals[1]);
              if (vals[2] != null) parts.push(vals[2] + '°C');
              if (vals[3] != null) parts.push('Fan: ' + (FAN_SPEEDS[vals[3]] || vals[3]));
              if (vals[4] != null)
                parts.push(
                  'Swing: ' + (vals[4] === 0 ? 'Auto' : vals[4] === 255 ? 'Off' : vals[4]),
                );
              return '<span class="ddw-attr-val">' + esc(parts.join(' · ')) + '</span>';

            default:
              return '<span class="ddw-attr-val">' + esc(vals.join(', ')) + '</span>';
          }
        }

        /* ── Parse state into per-element structure ────────── */

        /**
         * State from API can be:
         *   { state: { "1": { "1": [1,1], "28": [28,800] }, "2": { "1": [1,0] } } }
         * or directly:
         *   { "1": { "1": [1,1], "28": [28,800] } }
         * Returns array of { elementId, attrs: [{ attrId, values }] } or null.
         */
        function parseState(raw) {
          if (!raw || typeof raw !== 'object') return null;

          // Unwrap if nested under .state key
          var stateObj = raw;
          if (raw.state && typeof raw.state === 'object' && !Array.isArray(raw.state)) {
            stateObj = raw.state;
          }

          // Also handle array wrapper (location state format)
          if (Array.isArray(stateObj)) {
            if (stateObj.length > 0 && stateObj[0] && stateObj[0].state) {
              stateObj = stateObj[0].state;
            } else {
              return null;
            }
          }

          var elementIds = Object.keys(stateObj).sort(function (a, b) {
            return Number(a) - Number(b);
          });
          if (elementIds.length === 0) return null;

          // Check if this looks like element→attribute structure (values should be objects)
          var first = stateObj[elementIds[0]];
          if (!first || typeof first !== 'object' || Array.isArray(first)) return null;

          var elements = [];
          for (var i = 0; i < elementIds.length; i++) {
            var eid = elementIds[i];
            var attrObj = stateObj[eid];
            if (!attrObj || typeof attrObj !== 'object') continue;

            var attrIds = Object.keys(attrObj).sort(function (a, b) {
              return Number(a) - Number(b);
            });
            var attrs = [];
            for (var j = 0; j < attrIds.length; j++) {
              attrs.push({ attrId: attrIds[j], values: attrObj[attrIds[j]] });
            }
            elements.push({ elementId: eid, attrs: attrs });
          }

          return elements.length > 0 ? elements : null;
        }

        /* ── Build the card HTML ──────────────────────────── */

        function render(data) {
          if (!data) return;

          var icon = data.deviceIcon || getIcon(data.deviceType);
          var label = data.label || 'Unnamed Device';
          var desc = data.desc || '';
          var deviceType = data.deviceType || null;
          var locationLabel = data.locationLabel || null;
          var groupLabel = data.groupLabel || null;
          var brand = data.brand || null;
          var ownership = data.ownership || null;
          var stateElements = parseState(data.state);

          // Technical details (hidden by default)
          var uuid = data.uuid || null;
          var mac = data.mac || null;
          var productId = data.productId || null;
          var locationId = data.locationId || null;
          var groupId = data.groupId || null;
          var eid = data.eid != null ? data.eid : null;
          var endpoint = data.endpoint || null;
          var elementIds = data.elementIds || [];

          var html = '<div class="ddw-card">';

          /* Header */
          html += '<div class="ddw-header"><div class="ddw-title-row">';
          html += '<div class="ddw-device-icon">' + esc(icon) + '</div>';
          html += '<div class="ddw-title-text">';
          html += '<div class="ddw-label">' + esc(label) + '</div>';
          if (desc) html += '<div class="ddw-desc">' + esc(desc) + '</div>';
          html += '</div>';
          if (deviceType) html += '<span class="ddw-badge">' + esc(deviceType) + '</span>';
          html += '</div></div>';

          /* Body */
          html += '<div class="ddw-body">';

          /* Info grid */
          var hasInfo = locationLabel || groupLabel;
          if (hasInfo) {
            html += '<div class="ddw-info-grid">';
            if (locationLabel) {
              html += '<div class="ddw-info-item">';
              html += '<div class="ddw-info-label">Location</div>';
              html += '<div class="ddw-info-value">' + esc(locationLabel) + '</div>';
              html += '</div>';
            }
            if (groupLabel) {
              html += '<div class="ddw-info-item">';
              html += '<div class="ddw-info-label">Group</div>';
              html += '<div class="ddw-info-value">' + esc(groupLabel) + '</div>';
              html += '</div>';
            }
            html += '</div>';
          }

          /* State section — per-element blocks */
          html += '<div class="ddw-state-section">';
          html += '<div class="ddw-section-label">Device State</div>';

          if (stateElements) {
            var multiElement = stateElements.length > 1;

            for (var ei = 0; ei < stateElements.length; ei++) {
              var el = stateElements[ei];
              html += '<div class="ddw-element-block">';

              /* Element header — only show label for multi-element devices */
              if (multiElement) {
                html += '<div class="ddw-element-header">';
                html += '<span class="ddw-element-id">Element ' + esc(el.elementId) + '</span>';
                html += '</div>';
              }

              /* Render ALL attributes as chips — each type has its own visual */
              html += '<div class="ddw-attr-list">';
              for (var ai = 0; ai < el.attrs.length; ai++) {
                var attr = el.attrs[ai];
                var attrName = ATTR_NAMES[attr.attrId] || 'Attr ' + attr.attrId;
                html += '<div class="ddw-attr-chip">';
                html += '<span class="ddw-attr-name">' + esc(attrName) + '</span> ';
                html += formatAttrValue(attr.attrId, attr.values);
                html += '</div>';
              }
              html += '</div>';

              html += '</div>'; // element-block
            }
          } else {
            html += '<div class="ddw-state-empty">No state data available</div>';
          }
          html += '</div>';

          /* Technical details (collapsible) */
          var technicalRows = [];
          if (brand) technicalRows.push(['Brand', brand]);
          if (ownership) technicalRows.push(['Ownership', ownership]);
          if (uuid) technicalRows.push(['UUID', uuid]);
          if (mac) technicalRows.push(['MAC', mac]);
          if (productId) technicalRows.push(['Product ID', productId]);
          if (locationId) technicalRows.push(['Location ID', locationId]);
          if (groupId) technicalRows.push(['Group ID', groupId]);
          if (eid != null) technicalRows.push(['EID', eid]);
          if (endpoint) technicalRows.push(['Endpoint', endpoint]);
          if (elementIds.length > 0) technicalRows.push(['Element IDs', elementIds.join(', ')]);

          if (technicalRows.length > 0) {
            html +=
              "<button class=\"ddw-details-toggle\" aria-expanded=\"false\" onclick=\"this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); this.nextElementSibling.classList.toggle('ddw-open')\">";
            html += '<span class="ddw-details-arrow">\u25B6</span> Technical Details';
            html += '</button>';
            html += '<div class="ddw-details-content">';
            for (var ti = 0; ti < technicalRows.length; ti++) {
              html += detailRow(technicalRows[ti][0], technicalRows[ti][1]);
            }
            html += '</div>';
          }

          html += '</div>'; // body

          /* Footer */
          html += '<div class="ddw-footer">';
          html += '<span class="ddw-footer-text">Rogo IoT Cloud</span>';
          html += '</div>';

          html += '</div>'; // card

          root.innerHTML = html;
        }

        function detailRow(key, value) {
          return (
            '<div class="ddw-detail-row">' +
            '<span class="ddw-detail-key">' +
            esc(key) +
            '</span>' +
            '<span class="ddw-detail-val">' +
            esc(value) +
            '</span>' +
            '</div>'
          );
        }

        /* ── Data bridge: OpenAI Apps SDK ─────────────────── */

        // 1. Try reading initial data from window.openai globals
        if (window.openai && window.openai.toolOutput) {
          render(window.openai.toolOutput);
        }

        // 2. Listen for tool-result via postMessage (MCP Apps bridge)
        window.addEventListener(
          'message',
          function (event) {
            if (event.source !== window.parent) return;
            var msg = event.data;
            if (!msg || typeof msg !== 'object') return;

            // Standard MCP Apps bridge message
            if (msg.jsonrpc === '2.0' && msg.method === 'ui/notifications/tool-result') {
              var sc = msg.params && msg.params.structuredContent;
              if (sc) render(sc);
            }

            // Direct structuredContent pass-through (some hosts)
            if (msg.type === 'tool-result' && msg.structuredContent) {
              render(msg.structuredContent);
            }
          },
          { passive: true },
        );

        // 3. Listen for set_globals event (OpenAI Apps SDK)
        window.addEventListener(
          'openai:set_globals',
          function (event) {
            var globals = event.detail && event.detail.globals;
            if (globals && globals.toolOutput) {
              render(globals.toolOutput);
            }
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>
