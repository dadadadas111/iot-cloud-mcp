services:
  xiaozhi-cloud:
    image: ghcr.io/dadadadas111/iot-cloud-mcp:${IMAGE_TAG:-xiaozhi-cloud-latest}
    container_name: xiaozhi-cloud
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8080"
    depends_on:
      - xiaozhi-cloud-redis
    networks:
      - xiaozhi-cloud
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  xiaozhi-cloud-redis:
    image: redis:7-alpine
    container_name: xiaozhi-cloud-redis
    restart: unless-stopped
    volumes:
      - xiaozhi-cloud-redis-data:/data
    networks:
      - xiaozhi-cloud

networks:
  xiaozhi-cloud:
    driver: bridge

volumes:
  xiaozhi-cloud-redis-data:
