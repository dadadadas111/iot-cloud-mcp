
services:
  iot-cloud-mcp-staging:
    image: ghcr.io/dadadadas111/iot-cloud-mcp:${IMAGE_TAG}
    container_name: iot-cloud-mcp-staging
    restart: unless-stopped
    ports:
      - '${PORT:-3002}:3002'
    environment:
      # Server
      NODE_ENV: ${NODE_ENV:-staging}
      PORT: ${PORT:-3002}
      HOST: ${HOST:-0.0.0.0}

      # IoT Cloud API
      IOT_API_BASE_URL: ${IOT_API_BASE_URL}
      IOT_API_TIMEOUT: ${IOT_API_TIMEOUT:-30000}

      # CORS Configuration (always enabled for MCP)
      ENABLE_CORS: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # Rate Limiting
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60000}

      # Redis Configuration
      REDIS_HOST: ${REDIS_HOST:-redis-staging}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      BASE_URL: ${BASE_URL:-https://mcp-stag.dash.id.vn}

      # MCP Session
      MCP_SESSION_TTL: ${MCP_SESSION_TTL:-3600}

    depends_on:
      - redis-staging
    networks:
      - iot-network-staging

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  redis-staging:
    image: redis:7-alpine
    container_name: iot-cloud-redis-staging
    restart: unless-stopped
    volumes:
      - redis-data-staging:/data
    networks:
      - iot-network-staging

networks:
  iot-network-staging:
    driver: bridge

volumes:
  redis-data-staging:
