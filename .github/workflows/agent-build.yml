name: Build and Deploy rogo-agent (Production)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'apps/rogo-agent/**'
      - '.github/workflows/agent-build.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: agent-latest

jobs:
  build-and-push:
    name: Build rogo-agent image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/rogo-agent
          file: ./apps/rogo-agent/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:agent-${{ github.sha }}
          cache-from: type=gha,scope=rogo-agent
          cache-to: type=gha,mode=max,scope=rogo-agent

      - name: Image digest
        run: echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

  deploy:
    name: Deploy to VPS (production)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /opt/rogo-agent

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull the new image before stopping the running container
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            docker compose down || true
            docker compose up -d

            echo "Waiting for rogo-agent to start..."
            sleep 10

            docker compose ps
            docker compose logs --tail=50 rogo-agent

            # Remove dangling images older than 24h
            docker image prune -af --filter "until=24h" || true

            echo "rogo-agent production deployment complete — https://agent.mcp.dash.id.vn"
