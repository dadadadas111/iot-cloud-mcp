name: Build and Deploy rogo-agent (Staging)

on:
  pull_request:
    types: [labeled, synchronize]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build rogo-agent staging image
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'deploy-agent-staging')

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=agent-staging-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/rogo-agent
          file: ./apps/rogo-agent/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=rogo-agent-staging
          cache-to: type=gha,mode=max,scope=rogo-agent-staging

      - name: Image digest
        run: echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

  deploy:
    name: Deploy to VPS (staging)
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: REGISTRY,IMAGE_NAME,IMAGE_TAG,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            cd /opt/rogo-agent-stag

            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            docker pull ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}

            IMAGE_TAG=${IMAGE_TAG} docker compose down || true
            IMAGE_TAG=${IMAGE_TAG} docker compose up -d

            echo "Waiting for rogo-agent staging to start..."
            sleep 10

            docker compose ps
            docker compose logs --tail=50 rogo-agent-staging

            docker image prune -af --filter "until=24h" || true

            echo "rogo-agent staging deployment complete — https://agent.mcp-stag.dash.id.vn"
