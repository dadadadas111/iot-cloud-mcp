name: Build and Deploy xiaozhi-cloud

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'apps/xiaozhi-cloud/**'
      - '.github/workflows/xiaozhi-cloud.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build xiaozhi-cloud image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/xiaozhi-cloud
          file: ./apps/xiaozhi-cloud/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:xiaozhi-cloud-latest
          cache-from: type=gha,scope=xiaozhi-cloud-prod
          cache-to: type=gha,mode=max,scope=xiaozhi-cloud-prod

      - name: Upload production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: apps/xiaozhi-cloud/docker-compose.yml
          target: /opt/xiaozhi-cloud
          strip_components: 2

  deploy:
    name: Deploy xiaozhi-cloud
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: REGISTRY,IMAGE_NAME,GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            mkdir -p /opt/xiaozhi-cloud
            cd /opt/xiaozhi-cloud
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            docker pull ${REGISTRY}/${IMAGE_NAME}:xiaozhi-cloud-latest
            docker compose down || true
            docker compose up -d
            sleep 10
            docker compose ps
            docker compose logs --tail=80 xiaozhi-cloud
